# Home Assistant -> eye target bridge config.
# Comments go on their own line.

[home_assistant]
# Your HA WebSocket URL. Usually ws://<ha-host>:8123/api/websocket
# (use wss:// if you front HA with TLS).
url = ws://homeassistant.local:8123/api/websocket
# A Long-Lived Access Token: HA -> your profile -> Security -> Create Token.
# Better: leave this blank and set the HA_TOKEN environment variable instead
# (the service unit can hold it), so the token isn't sitting in a file.
token =

[entities]
# The sensor exposes per-target coordinate entities. Find the EXACT names in
# HA -> Developer Tools -> States (search "target"). Replace the device name
# with your device's name; {n} is filled in for each target 1..target_count.
# Requires the "Targets Position" option enabled on the device (it usually is).
target_count = 3
x_pattern = sensor.s1_pro_multi_sense_ae8394_target_{n}_x
y_pattern = sensor.s1_pro_multi_sense_ae8394_target_{n}_y
# Optional per-target "active" flag. Leave blank if your device doesn't have it;
# the bridge then treats a non-zero X/Y as an active target.
# Leave blank if the device has no per-target active entity (the S1 Pro
# doesn't); any non-zero coordinate then counts as a live target.
active_pattern =

[mqtt]
# Same broker the eyes use.
host = 192.168.86.5
port = 1883
username =
password =
target_topic = halloween/eyes/target
# The bridge listens on the eyes' command topic and only publishes targets while
# the show is running — no point streaming radar data all day. One Home
# Assistant message controls the eyes, the projectors and the bridge together.
command_topic = halloween/eyes/command
# Set false to publish targets continuously regardless of the command topic.
follow_command = true
# Whether tracking is enabled before any command arrives. Keep false so the
# bridge starts quiet; a retained "on" will wake it within a second of startup.
start_enabled = false

[calibration]
# --- horizontal (the main one) ---
# Lateral millimetres that map to a full eye look (-1..+1). Stand at the left
# and right edges of where you want the eye to reach, read the target X value in
# HA, and set this to that magnitude. Bigger = the eye moves less per metre.
x_range_mm = 250
# If the sensor's centerline isn't the center of your scene, shift it (mm).
x_offset_mm = 0
# Flip if the eye looks the wrong way left/right.
invert_x = false

# --- sensor placement (optional) ---
# Use when the sensor is NOT at the eyes, e.g. out at the side of the
# driveway. The bridge then turns each target into a real look angle from the
# eyes, and x_range_mm / x_offset_mm are ignored. Picture it from above,
# standing at the house facing the street: the origin is the house wall midway
# between the two eyes, +X is to your right, +Y is straight out to the street.
geometry = false
# Millimetres per sensor unit. Stand 2 m straight in front of the sensor and
# read its target Y in HA: about 2000 means 1, about 200 means 10.
sensor_unit_mm = 1
# Where the sensor is, in mm from the origin (+ = right, + = toward street).
sensor_x_mm = 0
sensor_y_mm = 0
# How far the sensor is turned to the LEFT of straight out (negative = right).
sensor_yaw_deg = 0
# Stand to the sensor's right (as seen from behind it): X must read positive.
# If it reads negative, set this true.
sensor_flip_x = false
# Look angle from the eyes, either side of straight out, that is a full look.
gaze_max_deg = 60

# --- optional vertical from distance ---
# If true, the eye also tips "down" as a target gets closer (fun on a porch).
# With geometry = true, y_near_mm / y_far_mm are the distance from the eyes.
y_from_distance = false
y_near_mm = 500
y_far_mm = 4000

# --- smoothing / rate ---
# smooth_factor: 0..1 fraction toward the new position each publish. Higher =
# snappier, lower = smoother (calmer against mmWave jitter). 1 = raw.
smooth_factor = 0.6
publish_hz = 20
# Re-send the current target this often so a person standing still doesn't time
# out and get dropped. Keep below the eye's target_hold (default 2.0s).
heartbeat_s = 0.75
# Passed to the eye as each target's hold; match the eye's target_hold.
hold_s = 2.0

[status]
# Bridge status for Home Assistant over MQTT discovery: running, tracking,
# last target seen, which Pi it runs on, and whether its HA link is up. Keeps
# publishing (slowly) while the show is off, so HA can tell "off" from "dead".
enabled = true
node = bridge
# Must match the eyes' config.ini [status] base_topic.
base_topic = halloween/eyes/status
discovery_prefix = homeassistant
# Republish this often (seconds) even when nothing has changed.
refresh_s = 60
# While someone is being tracked, update "last target seen" at most this often.
last_seen_every_s = 10
