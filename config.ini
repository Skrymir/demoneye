# Demon Eye — per-machine settings.
# This file holds everything that differs between your two Pis, so dropping in a
# new demoneye.py never overwrites your broker details or alignment.
# Lines starting with # or ; are comments. Put comments on their OWN line
# (an inline comment after a value would be read as part of the value).
# Both Pis must share the same [mqtt] section.

[mqtt]
host = 192.168.86.5
port = 1883
username =
password =
topic = halloween/eyes/state
# Home Assistant publishes on/off here to start/stop playback.
command_topic = halloween/eyes/command
# A sensor bridge publishes look-here targets here (brain subscribes).
target_topic = halloween/eyes/target

[control]
# playing = render as soon as it starts; idle = show black and wait for an "on"
# command on command_topic. Either way it always listens, so HA can start/stop
# it any time. For an HA-scheduled decoration, "idle" is usually what you want.
start = playing
# seconds to keep tracking a target after its last update before returning to idle
target_hold = 2.0
# The eyes are projected ABOVE the people they watch, so a target reported as
# level is really below them. This tilts the gaze down while tracking.
# 0 = no tilt, 0.3-0.5 typical, 1.0 = look as far down as the eye can.
# Raise it for eyes mounted higher or viewers standing closer to the house.
track_look_down = 0.35
# A follower that stops hearing from the brain goes dark after this many
# seconds instead of freezing on its last frame all night. 0 disables.
stale_after_s = 2.0
# With the projector off there's no display to open. Wait and retry this often
# (seconds) instead of exiting. 0 = exit immediately.
display_retry_s = 5

[projector]
# Power the projector on/off with the same Home Assistant command that starts
# and stops the show, using ir-ctl (the kernel does the NEC/38kHz timing).
# Test your setup first:  python ir_control.py test
ir_enabled = false
# Your ir-ctl keymap file (the .toml with the scancode -> key mapping).
keymap = /home/fpp/groview.toml
# Leave blank to let ir-ctl pick, or pin it e.g. /dev/lirc0
device =
# Key name from the keymap used to toggle power.
power_key = KEY_POWER
# If the remote has DISCRETE on and off keys, set true and name them below.
separate_on_off = false
on_key = KEY_POWER
off_key = KEY_POWER
# Send the code this many times (some projectors miss the first press).
repeat = 1
# Many projectors need POWER pressed twice to confirm shutdown; set 1 if so.
off_confirm = 1
# Seconds between the power press and the confirming press.
off_confirm_gap_s = 2.0
# Seconds to wait after power-on before the eye appears (projector warm-up).
warmup_s = 0
# Closed loop: confirm each power command via the HDMI hot-plug state (an off
# projector reads "disconnected"). Never presses POWER when the projector is
# already where it should be, retries if a press was missed. Don't combine with
# a forced video=...D mode in cmdline.txt (it hides the real state).
verify = true
; auto = any HDMI port, or e.g. /sys/class/drm/card1-HDMI-A-1/status
status_path = auto
on_timeout_s = 45
off_timeout_s = 60
retries = 1

[stage]
# Only used with --mode stage, where the projectors are viewports onto ONE
# virtual stage (0..1) that is wider than any single window. THIS Pi shows the
# slice between stage_from and stage_to, so a figure walking the stage crosses
# from window to window — and vanishes into the wall in between.
#
#   stage:   0.0 ..................................................... 1.0
#   window1: [0.00 -- 0.40]        window2:            [0.60 -- 1.00]
#                          \___ solid wall ___/
#
# Set these to roughly match where each window sits on your house. The gap is
# the wall between them: make it about as wide (in stage units) as the real
# wall is relative to the windows.
stage_from = 0.00
stage_to   = 0.40
# Figure height as a fraction of the window.
figure_scale = 0.72
# Walking speed in stage units per second (0.085 crosses the stage in ~12s).
speed = 0.085
# If true the figure only moves while NOBODY is detected, and freezes the
# moment someone is — so it never appears to move while being watched.
freeze_when_watched = false
# Which way the SOURCE frames face. If your render walks right-to-left, set
# "left" — otherwise the figure will moonwalk backwards.
figure_faces = left
# Stage distance covered by ONE full walk cycle. This keeps the feet planted:
# if the figure slides forward (moonwalking) lower it; if the legs churn faster
# than it travels, raise it. Independent of speed — change speed and the legs
# keep up automatically.
figure_stride = 0.075
# Optional sprite atlas of a pre-rendered walk cycle (see sprite_atlas.py).
# Set it and stage mode uses the sprite shader instead of the procedural
# silhouette — this is how you use a Blender/Mixamo figure. Path is relative
# to this config file. Leave blank for the built-in silhouette.
figure_atlas = figures/shambler.png

[display]
# Position and size of THIS Pi's eye, to line it up with what it projects onto.
# center_x: 0 = left edge, 1 = right edge
# center_y: 0 = top,       1 = bottom
center_x = 0.50
center_y = 0.50
scale    = 1.00

# For a symmetric PAIR, set mirror = true on ONE projector (the right-hand eye).
# mirror:      flip horizontally (glint side) for a matched face
# mirror_gaze: also flip look direction (eyes diverge/converge)
mirror       = false
mirror_gaze  = false

# How far the eye's gaze travels. 1.0 = subtle (good for idle-only setups).
# Raise this so a tracked person can clearly tell they're being watched;
# 1.6-2.2 reads well on a house. Too high and the iris hits the lids.
gaze_scale   = 1.8
# Vertical travel, usually less than horizontal.
gaze_scale_y = 1.3

# HDMI mode sent to the projector. 1280x720 holds 60 fps on a Pi 5 and looks
# the same on a house; "native" = the projector's preferred mode (1080p is too
# heavy for the demon eye at 60 fps).
output_mode = 1280x720
# Optional: draw below the output resolution and scale up (0 = off). Leave 0
# on a Pi: the extra scaling pass caused dropped frames there (measured: 0 =
# no late frames at 720p; 540 and 360 = 11-14 late frames per second).
render_height = 0

[status]
# Live status for Home Assistant over MQTT discovery: running, projector on/off,
# show state (playing / idle / waiting_for_display / lost_brain) and role. The
# entities appear in HA by themselves (Settings -> Devices -> "Demon Eye Left").
# Needs HA's MQTT integration on the same broker as [mqtt] above.
enabled = true
# Name this eye publishes under. auto = left / right from the hostname
# (pi-eye-left -> left). The two Pis must end up with DIFFERENT names.
node = auto
base_topic = halloween/eyes/status
# HA's discovery prefix (MQTT integration settings). Almost always homeassistant.
discovery_prefix = homeassistant
# Republish this often (seconds) even when nothing has changed. Changes are
# sent within a second regardless.
refresh_s = 30
# How often to read the projector's HDMI state (seconds).
projector_poll_s = 5
